<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/svg/chpl.svg" />
  <title>Rejestr Produktów Leczniczych — wyszukiwarka</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main">
    <h1>Rejestr Produktów Leczniczych</h1>
    <p class="subtitle">hybrydowa wyszukiwarka semantyczna (RRF)</p>

    <form id="searchForm" onsubmit="event.preventDefault(); updateURLAndSearch();">
      <input type="text" placeholder="Wpisz objawy, nazwę leku lub problem..." id="searchBox" autofocus autocomplete="off" />
      <button type="submit" id="searchButton">Szukaj</button>
    </form>

    <div class="results" id="results"></div>

    <footer class="app-footer">
      <p id="dbStatsText">Baza danych: wczytywanie...</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
