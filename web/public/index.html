<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/svg/chpl.svg" />
  <title>powlekane.pl — Wyszukiwarka Leków, Wskazań i ChPL</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="global-site-header">
    <div class="header-inner">
      <a href="/" class="brand-link" title="Strona główna powlekane.pl">
        <img src="/svg/chpl.svg" alt="powlekane.pl Logo" class="brand-logo" width="24" height="24" />
        <span class="brand-title">powlekane<span class="brand-tld">.pl</span></span>
        <span class="brand-badge">Wyszukiwarka</span>
      </a>
      <nav class="header-nav">
        <span class="header-nav-status">Wyszukiwarka leków i ChPL</span>
      </nav>
    </div>
  </header>

  <div class="main">
    <h1>powlekane<span class="brand-tld">.pl</span></h1>
    <p class="subtitle">inteligentna wyszukiwarka leków, wskazań i interakcji (RPL / ChPL)</p>

    <form id="searchForm" onsubmit="event.preventDefault(); updateURLAndSearch();">
      <div class="search-input-wrap">
        <input type="text" placeholder="Wpisz objawy, nazwę leku lub problem..." id="searchBox" autofocus autocomplete="off" />
        <button type="submit" id="searchButton">Szukaj</button>
        <div id="suggestionsDropdown" class="suggestions-dropdown" style="display:none;"></div>
      </div>
      <div class="search-options">
        <label class="filter-refund-label">
          <input type="checkbox" id="refundOnlyCheck" onchange="updateURLAndSearch()" />
          <span>Tylko leki refundowane (NFZ)</span>
        </label>
      </div>
    </form>

    <div class="results" id="results"></div>

    <footer class="app-footer">
      <p id="dbStatsText">Baza danych: wczytywanie...</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
