services:
  rpl-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpl-search
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-https://s3.waw.io.cloud.ovh.net}
      - S3_BUCKET=${S3_BUCKET:-plek}
      - S3_KEY=${S3_KEY:-backups/rpl_2026-08-25_wikidata_uses.db.zst}
      - AWS_REGION=${AWS_REGION:-waw}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      # Persistent named volume for SQLite database & Hugging Face model cache
      - rpl_data:/app/data
      - rpl_cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  rpl_data:
    name: rpl_search_data
  rpl_cache:
    name: rpl_model_cache
