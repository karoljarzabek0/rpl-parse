[package]
name = "rpl-parse"
version = "0.1.0"
edition = "2024"

[dependencies]
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.dev]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 0

