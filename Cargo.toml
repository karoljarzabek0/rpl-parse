[package]
name = "rpl-parse"
version = "0.1.0"
edition = "2024"

[dependencies]
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.70", features = ["behavior-version-latest"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig", "http"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
indicatif = { version = "0.17", features = ["tokio"] }
byteorder = "1.5"


[profile.dev]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 0

